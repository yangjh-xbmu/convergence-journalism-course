<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卓越班课程网站 · 三套设计体系备选方案总览画廊</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      background-color: #1a1918;
      color: #ede8df;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部控制栏 */
    .gallery-topbar {
      background-color: #141312;
      border-bottom: 1px solid #2d2a26;
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-title small {
      color: #8c867a;
      font-weight: normal;
    }

    .tab-switch-group {
      display: flex;
      gap: 0.5rem;
      background-color: #22201d;
      padding: 0.25rem;
      border-radius: 4px;
      border: 1px solid #3d3832;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #9e978b;
      padding: 0.45rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: #fff;
    }

    .tab-btn.active {
      background-color: #9b2c1f;
      color: #fff;
      font-weight: 600;
    }

    .view-actions {
      display: flex;
      gap: 0.75rem;
    }

    .open-direct-btn {
      color: #d4a373;
      text-decoration: none;
      font-size: 0.8125rem;
      border: 1px solid #7a5e3d;
      padding: 0.35rem 0.75rem;
      border-radius: 3px;
      transition: all 0.2s;
    }

    .open-direct-btn:hover {
      background-color: #382c1f;
      color: #fff;
    }

    /* 主展示视口 iframe */
    .preview-frame-wrap {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header class="gallery-topbar">
    <div class="brand-title">
      <span>卓越班课程站点 · 书籍设计体系方案评选</span>
      <small>融合新闻产品策划与制作</small>
    </div>

    <div class="tab-switch-group">
      <button class="tab-btn" onclick="selectPlan('proposal-a.html', this, '方案 A：学术文库经典型 (Oxford/Cambridge Monograph)')">方案 A：经典学术专著型</button>
      <button class="tab-btn active" onclick="selectPlan('proposal-b.html', this, '方案 B：现代编辑部大刊型 (Broadsheet 1440px)')">方案 B：现代编辑部大刊型</button>
      <button class="tab-btn" onclick="selectPlan('proposal-c.html', this, '方案 C：文人手札工坊型 (Song-dynasty Manuscript)')">方案 C：文人手札工坊型</button>
    </div>

    <div class="view-actions">
      <a id="direct-link" class="open-direct-btn" href="proposal-b.html" target="_blank">↗ 在独立大标签页打开</a>
    </div>
  </header>

  <main class="preview-frame-wrap">
    <iframe id="preview-iframe" src="proposal-b.html"></iframe>
  </main>

  <script>
    function selectPlan(url, btn, title) {
      document.getElementById('preview-iframe').src = url;
      document.getElementById('direct-link').href = url;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
